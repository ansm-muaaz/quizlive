<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing In — QuizLive</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <meta name="theme-color" content="#182838">

  <!-- Immediate Theme Initializer -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('quizlive-theme');
        if (savedTheme === 'dark' || savedTheme === 'light') {
          document.documentElement.setAttribute('data-bs-theme', savedTheme);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-bs-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--ql-bg);
      color: var(--ql-text);
      padding: 1rem;
    }
    .callback-card {
      background-color: var(--ql-surface);
      border: 1px solid var(--ql-border);
      border-radius: 14px;
      padding: 2.75rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: var(--ql-shadow-lg);
    }
    .spinner-anim {
      width: 48px;
      height: 48px;
      border: 4px solid var(--ql-surface-subtle);
      border-top-color: var(--ql-amber);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="callback-card" id="callbackCard">
    <div id="loadingState">
      <div class="spinner-anim"></div>
      <h3 class="fw-bold mb-2">Authenticating&hellip;</h3>
      <p class="text-muted small mb-0">Verifying session credentials with Supabase Auth.</p>
    </div>

    <div id="errorState" class="d-none">
      <div class="text-danger mb-3" style="font-size: 2.75rem;"><i class="bi bi-exclamation-circle-fill"></i></div>
      <h3 class="fw-bold mb-2">Authentication Failed</h3>
      <p class="text-muted small mb-4" id="errorMsg">Something went wrong while completing sign-in.</p>
      <a href="{{ url_for('login') }}" class="btn btn-primary w-100">
        <i class="bi bi-arrow-repeat me-1"></i> Return to Sign In
      </a>
    </div>
  </div>

  <script>
    (function() {
      // Check query string for error from OAuth provider
      const searchParams = new URLSearchParams(window.location.search);
      const urlError = searchParams.get('error_description') || searchParams.get('error');
      if (urlError) {
        showError(urlError);
        return;
      }

      const hash = window.location.hash.substring(1);
      if (!hash) {
        // If code exists in query string, the server handles it directly
        const code = searchParams.get('code');
        if (code) {
          window.location.reload();
          return;
        }
        showError('No authentication token received from identity provider.');
        return;
      }

      const params = new URLSearchParams(hash);
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');

      if (!accessToken) {
        showError('Missing access token. Please attempt sign-in again.');
        return;
      }

      const payload = {
        access_token: accessToken,
        refresh_token: refreshToken || '',
        token_type: params.get('token_type') || 'bearer',
        expires_in: params.get('expires_in') || ''
      };

      fetch('{{ url_for("callback_process") }}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(function(response) {
        if (response.redirected) {
          window.location.href = response.url;
          return;
        }
        return response.json().then(function(data) {
          if (data.redirect) {
            window.location.href = data.redirect;
          } else if (data.error) {
            showError(data.error);
          } else {
            showError('Unexpected response from authentication endpoint.');
          }
        });
      })
      .catch(function(err) {
        showError('Network error while processing authentication: ' + err.message);
      });

      function showError(msg) {
        document.getElementById('loadingState').classList.add('d-none');
        document.getElementById('errorState').classList.remove('d-none');
        document.getElementById('errorMsg').textContent = msg;
      }
    })();
  </script>
</body>
</html>
