{% extends "base.html" %}
{% block title %}System Error (500) — QuizLive{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      <div class="card p-5 border shadow-sm" style="background-color: var(--ql-surface); border-color: var(--ql-border) !important;">
        <div class="d-inline-flex p-3 rounded-circle mb-3 mx-auto" style="background-color: rgba(184, 50, 48, 0.15); color: var(--ql-terracotta);">
          <i class="bi bi-exclamation-triangle-fill display-4"></i>
        </div>
        <h1 class="display-5 fw-bold mb-2" style="color: var(--ql-text);">500</h1>
        <h3 class="fw-bold mb-2">Internal Server Error</h3>
        <p class="text-muted mb-4">
          An unexpected error occurred while processing your request. Please try again or return to the homepage.
        </p>
        <div class="d-flex flex-wrap justify-content-center gap-3">
          <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 py-2 fw-semibold">
            <i class="bi bi-house-door-fill me-1"></i> Return Home
          </a>
          <button onclick="window.location.reload();" class="btn btn-outline-primary px-4 py-2 fw-semibold">
            <i class="bi bi-arrow-clockwise me-1"></i> Reload Page
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
